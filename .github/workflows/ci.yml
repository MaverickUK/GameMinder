name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  FPC_VERSION: 3.2.2

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version.sh

  unit-tests:
    name: Unit tests (Free Pascal, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fpc
      - name: Build tests
        run: mkdir -p build && fpc -Mtp -Fu. -FUbuild -obuild/tests tests/TESTS.PAS
      - name: Run tests
        run: build/tests

  dos-build:
    name: Build for DOS (Free Pascal i8086-msdos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fpc nasm

      - name: Cache i8086-msdos cross compiler
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/fpc-msdos
          key: fpc-${{ env.FPC_VERSION }}-i8086-msdos-large-v1

      - name: Build i8086-msdos cross compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o fpc-src.tar.gz \
            "https://downloads.sourceforge.net/project/freepascal/Source/${FPC_VERSION}/fpc-${FPC_VERSION}.source.tar.gz"
          tar xzf fpc-src.tar.gz
          make -C "fpc-${FPC_VERSION}" crossall crossinstall \
            CPU_TARGET=i8086 OS_TARGET=msdos \
            CROSSOPT="-WmLarge -CX -XX" BINUTILSPREFIX= \
            INSTALL_PREFIX="$HOME/fpc-msdos"

      - name: Build GAMEMIND.EXE and TESTS.EXE
        run: |
          # Locate the installed cross compiler and msdos units
          PPC=$(find "$HOME/fpc-msdos" -name ppcross8086 -type f | head -1)
          SYSTEM_PPU=$(find "$HOME/fpc-msdos" -path '*msdos*' -name system.ppu | head -1)
          UNITS=$(dirname "$(dirname "$SYSTEM_PPU")")
          echo "Compiler: $PPC"
          echo "Units:    $UNITS"
          ls "$UNITS"
          mkdir -p build/dos

          # ExecSwap's swapping core, linked into the startup code segment
          nasm -f obj -o EXECSWAP/FPC/SWAPCORE.OBJ EXECSWAP/FPC/SWAPCORE.ASM

          build() {
            "$PPC" -Tmsdos -WmLarge -Mtp -O2 \
              -Fu. -FuEXECSWAP/FPC -FoEXECSWAP/FPC -Fu"$UNITS/*" \
              -Xm -FUbuild/dos -o"$2" "$1"
          }
          build GAMEMIND.PAS build/dos/GAMEMIND.EXE
          build tests/TESTS.PAS build/dos/TESTS.EXE
          build tests/MEMFREE.PAS build/dos/MEMFREE.EXE
          ls -l build/dos/*.EXE

      - name: Show memory layout
        run: |
          # ExecSwap keeps everything below FirstToSave in memory while a game runs,
          # so it should be in the first code segment
          map=$(ls build/dos/*.map build/*.map GAMEMIND.map 2>/dev/null | grep -i gamemind | head -1 || true)
          if [ -n "$map" ]; then
            grep -iE -m 40 "_TEXT|DGROUP|STACK|FirstToSave|ExecSwapCore|Segment|Group" "$map" || head -60 "$map"
          else
            echo "No map file found"; ls build/dos
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gamemind-dos
          path: |
            build/dos/GAMEMIND.EXE
            build/dos/TESTS.EXE
            build/dos/MEMFREE.EXE

  dos-smoke:
    name: Smoke test in DOSBox
    needs: dos-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gamemind-dos
          path: build/dos

      - name: Install DOSBox
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dosbox

      - name: Run in DOSBox
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cd build/dos
          printf 'ScanPath:D:\\GAMES\r\n' > SETTINGS.TXT
          printf 'ScanPath:D:\\MEMTEST\r\nVerboseOutput:true\r\nUseEmsForSwapFile:true\r\n' > SETEMS.TXT
          printf 'ScanPath:D:\\MEMTEST\r\nVerboseOutput:true\r\nUseEmsForSwapFile:false\r\n' > SETDISK.TXT

          # Run DOS commands in a fresh DOSBox, with C: = build/dos and D: = tests/fixtures.
          # Commands go in a batch file, as DOSBox only runs the first few -c options.
          dos() {
            : > SESSION.BAT
            for cmd in "$@"; do printf '%s\r\n' "$cmd" >> SESSION.BAT; done
            timeout 120 dosbox -c "mount c ." -c "mount d ../../tests/fixtures" -c "c:" \
              -c "CALL SESSION.BAT" -c "exit" > /dev/null 2>&1 || echo "DOSBox timed out running: $*"
          }

          dos "GAMEMIND.EXE /V > VER.TXT" "GAMEMIND.EXE /LIST > LIST.TXT" "GAMEMIND.EXE /LIST > LIST2.TXT" "TESTS.EXE D:\\ > TESTS.TXT"
          dos "MEMFREE.EXE C:\\BASE.TXT"
          dos "copy SETEMS.TXT SETTINGS.TXT" "GAMEMIND.EXE /RUN memory > RUNEMS.TXT" "ren VIAGM.TXT VIAEMS.TXT"
          dos "copy SETDISK.TXT SETTINGS.TXT" "GAMEMIND.EXE /RUN memory > RUNDISK.TXT" "ren VIAGM.TXT VIADISK.TXT"
          dos "copy SETEMS.TXT SETTINGS.TXT" "GAMEMIND.EXE /SCAN /RUN script > RUNSCRPT.TXT"

          # Everything again in one session, as a user would, checking GameMinder returns to DOS each time
          dos "GAMEMIND.EXE /LIST > NUL" "TESTS.EXE D:\\ > NUL" "MEMFREE.EXE C:\\NUL.TXT" \
              "copy SETEMS.TXT SETTINGS.TXT" "GAMEMIND.EXE /RUN memory > NUL" "echo EMS > SESSION.TXT" \
              "copy SETDISK.TXT SETTINGS.TXT" "GAMEMIND.EXE /RUN memory > NUL" "echo DISK >> SESSION.TXT"

      - name: Show results
        if: always()
        run: |
          cd build/dos
          for f in VER LIST LIST2 TESTS BASE RUNEMS VIAEMS RUNDISK VIADISK RUNSCRPT VIASCRPT BEFORE AFTER SESSION; do
            echo "--- $f.TXT"; cat "$f.TXT" 2>/dev/null || echo "(missing)"
          done
          echo "--- !GM_LOG.TXT"; cat '../../tests/fixtures/MEMTEST/MEMFREE/!GM_LOG.TXT' 2>/dev/null || echo "(missing)"

      - name: Check results
        run: |
          cd build/dos
          grep -q "GameMinder v$(../../scripts/check-version.sh)" VER.TXT
          diff --strip-trailing-cr ../../tests/smoke/EXPECTED.TXT LIST.TXT
          # Second run uses the saved game list
          ls GMCACHE.TXT
          diff --strip-trailing-cr LIST.TXT LIST2.TXT
          grep -q " 0 failed" TESTS.TXT

      - name: Check memory left for games
        run: |
          cd build/dos
          base=$(tr -d '\r ' < BASE.TXT)
          ems=$(tr -d '\r ' < VIAEMS.TXT)
          disk=$(tr -d '\r ' < VIADISK.TXT)
          echo "Free memory for a game: DOS prompt ${base}KB, via GameMinder ${ems}KB (EMS swap), ${disk}KB (disk swap)"
          grep -q "bytes to EMS" RUNEMS.TXT
          grep -q 'bytes to C:\\SWAP' RUNDISK.TXT
          # ExecSwap leaves only a small stub, so a game should get within 8KB of the DOS prompt
          [ $((base - ems)) -le 8 ]
          [ $((base - disk)) -le 8 ]
          # GameMinder was swapped back in correctly and logged every play
          [ "$(grep -c '^>' '../../tests/fixtures/MEMTEST/MEMFREE/!GM_LOG.TXT')" -eq 4 ]
          [ "$(grep -c '^<' '../../tests/fixtures/MEMTEST/MEMFREE/!GM_LOG.TXT')" -eq 4 ]
          # ...and returned to DOS each time in a single session
          grep -q EMS SESSION.TXT && grep -q DISK SESSION.TXT

      - name: Check before/after commands and memory warning
        run: |
          cd build/dos
          base=$(tr -d '\r ' < BASE.TXT)
          script=$(tr -d '\r ' < VIASCRPT.TXT)
          echo "Free memory for a game with before/after commands: ${script}KB (DOS prompt ${base}KB)"
          grep -q before BEFORE.TXT
          grep -q after AFTER.TXT
          grep -q "needs 1000KB" RUNSCRPT.TXT
          # COMMAND.COM runs the before/after commands, so allow a little more
          [ $((base - script)) -le 16 ]

  package:
    name: Package release zip
    needs: [version, dos-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gamemind-dos
          path: build/dos

      - name: Package
        run: |
          VERSION=$(scripts/check-version.sh)
          mkdir -p dist/GAMEMIND
          cp build/dos/GAMEMIND.EXE SETTINGS.TXT README.md QUICKSTART.md CHANGELOG.md LICENSE dist/GAMEMIND/
          cp -r examples dist/GAMEMIND/EXAMPLES
          (cd dist && zip -qr "GameMinder-${VERSION}.zip" GAMEMIND && unzip -l "GameMinder-${VERSION}.zip")

      - uses: actions/upload-artifact@v4
        with:
          name: gameminder-package
          path: dist/*.zip
